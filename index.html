<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>부산 25% 약국 지도 · 동백전+페이스사인</title>
  <meta name="description" content="부산에서 동백전 적립과 네이버페이 페이스사인 적립을 함께 받을 수 있는 약국을 지도에서 찾아보세요." />
  <meta name="theme-color" content="#e8402a" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="25% 약국" />

  <!-- OpenGraph -->
  <meta property="og:title" content="부산 25% 약국 지도" />
  <meta property="og:description" content="동백전 + 페이스사인 적립을 함께 받는 약국 찾기" />
  <meta property="og:type" content="website" />

  <!-- Leaflet (무료 지도) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Google AdSense (배포 후 ca-pub-XXXX 교체) -->
  <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="map" aria-label="약국 지도"></div>

    <!-- 상단 바 -->
    <header id="topbar">
      <div class="brand">
        <span class="badge">25%</span>
        <span class="title">부산 약국 지도</span>
      </div>
      <div class="search">
        <input id="q" type="search" placeholder="약국 이름·지역 검색" autocomplete="off" aria-label="약국 검색" />
        <button id="qClear" type="button" aria-label="검색어 지우기" hidden>✕</button>
      </div>
      <div id="filters" class="filters">
        <button class="chip active" data-filter="all" type="button">전체</button>
        <button class="chip" data-filter="both" type="button">25% 가능</button>
        <button class="chip" data-filter="drug" type="button">💉 비만약 취급</button>
        <button class="chip" data-filter="near" type="button">내 주변</button>
      </div>
    </header>

    <!-- 내 위치 버튼 -->
    <button id="locate" type="button" aria-label="내 위치로 이동" title="내 위치로 이동">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="8"/><line x1="12" y1="1" x2="12" y2="4"/>
        <line x1="12" y1="20" x2="12" y2="23"/><line x1="1" y1="12" x2="4" y2="12"/>
        <line x1="20" y1="12" x2="23" y2="12"/><circle cx="12" cy="12" r="2" fill="currentColor"/>
      </svg>
    </button>

    <!-- 하단 목록 시트 -->
    <section id="sheet" class="sheet" aria-label="약국 목록">
      <button id="sheetToggle" class="sheet-toggle" type="button" aria-expanded="false">목록 펼치기 ▴</button>
      <div class="sheet-head">
        <strong id="sheetTitle">주변 약국</strong>
        <span id="sheetCount" class="count"></span>
      </div>
      <div id="list" class="list" role="list"></div>

      <!-- 광고 슬롯 (AdSense 승인 후 활성화) -->
      <div class="ad-slot" id="adSlot" aria-hidden="true">
        <!-- <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXX" data-ad-slot="YYYY" data-ad-format="auto" data-full-width-responsive="true"></ins> -->
        <span class="ad-ph">광고 영역</span>
      </div>
    </section>

    <!-- 상태 토스트 -->
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <!-- 위치정보 수집·이용 동의 모달 -->
  <div id="consent" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="consentTitle">
      <h2 id="consentTitle">위치정보 이용 동의</h2>
      <p>가까운 약국을 거리순으로 보여드리기 위해 <b>현재 위치</b>를 사용합니다.</p>
      <ul class="consent-list">
        <li>수집 항목: 단말기의 현재 위치(위도·경도)</li>
        <li>이용 목적: 주변 약국 검색 및 거리 계산</li>
        <li>보관: 위치정보는 <b>단말기 내에서만</b> 사용되며 서버로 전송·저장하지 않습니다.</li>
        <li>거부 시: 지도는 부산 서면 중심으로 표시되며, 수동으로 탐색할 수 있습니다.</li>
      </ul>
      <label class="consent-check">
        <input type="checkbox" id="consentAgree" /> 위 위치정보 수집·이용에 동의합니다.
      </label>
      <div class="modal-actions">
        <button id="consentDeny" class="btn ghost" type="button">거부(수동 탐색)</button>
        <button id="consentOk" class="btn primary" type="button" disabled>동의하고 내 위치 사용</button>
      </div>
    </div>
  </div>

  <!-- 면책/정보 모달 -->
  <div id="info" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
      <h2 id="infoTitle">안내 및 면책</h2>
      <div id="infoBody" class="info-body"></div>
      <div class="modal-actions">
        <button id="infoClose" class="btn primary" type="button">동의</button>
      </div>
    </div>
  </div>

  <button id="infoBtn" class="info-btn" type="button" aria-label="안내 및 면책">ⓘ</button>

  <script src="js/app.js"></script>
</body>
</html>
